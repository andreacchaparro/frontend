services:
  # Desarrollo local con hot reload
  dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
      - VITE_GEO_API_URL=http://localhost:8000/api/geo/sitios/
    command: sh -c "npm install && npm run dev"
    profiles: [dev]

  # Producción con Nginx (imagen ~20MB)
  prod:
    build:
      context: .
      target: production
    ports:
      - "8080:80"
    profiles: [prod]
